services:

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodlepass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - eachs_network

  moodle:
    image: ellakcy/moodle:mysql_maria_apache
    depends_on:
      - db
    environment:
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodlepass
      MOODLE_ADMIN: admin
      MOODLE_ADMIN_PASSWORD: Admin1234!
      MOODLE_ADMIN_EMAIL: admin@eachs.local
      MOODLE_URL: http://localhost:8080
    ports:
      - "8080:80"
    volumes:
      - moodle_data:/var/moodledata
    networks:
      - eachs_network

  eachs:
    build: .
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - .:/app
    networks:
      - eachs_network

volumes:
  db_data:
  moodle_data:

networks:
  eachs_network: